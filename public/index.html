<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buy Phase</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* One dark look on purpose: it copies the in-game buy screen layout. */
:root{
  --bg:#0b171a; --panel:rgba(255,255,255,.07); --panel-hi:rgba(255,255,255,.12); --line:rgba(255,255,255,.14);
  --teal:#6fe3c4; --teal-dim:#2c6f63; --teal-bar:#2b6d62; --fg:#e9f3f1; --muted:#93aaa6; --red:#ff7a7a; --gold:#e6c25a;
  --sans:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 700px at 30% 10%,#17353a 0%,#0b171a 60%,#070e10 100%) fixed;color:var(--fg);font-family:var(--sans);min-height:100vh;
  -webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:12px 16px 28px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.cr{font-size:30px;font-weight:700;letter-spacing:.02em;color:var(--teal);line-height:1}
.cr small{font-size:13px;color:var(--muted);font-weight:500;margin-left:6px;letter-spacing:.08em}
.score{flex:1;min-width:160px;text-align:center;font-size:18px;font-weight:600;letter-spacing:.08em}
.score small{display:block;font-size:12px;color:var(--gold);letter-spacing:.14em;min-height:14px}
.lock{background:var(--teal);color:#06231d;border:0;padding:9px 18px;font-weight:700;letter-spacing:.14em;font-size:15px;cursor:pointer;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.lock:disabled{opacity:.4;cursor:default}
.sb{background:var(--panel);border:1px solid var(--line);margin-bottom:8px;padding:6px 8px;display:grid;gap:4px}
.sbr{display:flex;align-items:center;gap:8px}
.sbr b{width:58px;font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--muted)}
.sbr .n{width:22px;font-size:24px;font-weight:700;line-height:1;text-align:center}
.sbr.me .n,.sbr.me .m{color:var(--teal)} .sbr.foe .n,.sbr.foe .m{color:var(--red)}
.tr{flex:1;display:flex;align-items:center;min-width:0;border-left:1px solid var(--line);padding-left:6px}
.tr i{flex:1 1 0;min-width:0;height:14px;display:flex;align-items:center;justify-content:center}
.tr i.d::after{content:"";width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.28)}
.tr i svg{width:100%;max-width:16px;height:auto}
.tr i.cur::after{background:var(--gold);width:5px;height:5px}
.tr i.hf{flex:0 0 12px;position:relative}
.tr i.hf::after{content:"";border:4px solid transparent;border-bottom-color:var(--gold);border-top:0;width:0;height:0;background:none}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}
.slot{background:var(--panel);border:1px solid var(--line);padding:11px 10px;cursor:pointer;text-align:left;min-width:0}
.slot span{display:block;font-size:19px;font-weight:600;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .ic{pointer-events:none}
.slot i{display:block;margin-top:3px;font-style:normal;font-size:14px;color:var(--muted)}
.foes .slot span{font-size:14px}
.slot.on{border-color:var(--teal);background:rgba(111,227,196,.14)}
.lbl{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:4px}
.lbl.first{margin-top:22px}
.foes{margin-bottom:6px}
.foes .slot{cursor:default;padding:5px 6px}
.slot .ic{display:flex;align-items:center;height:56px}
.slot .ic svg.g{flex:none;width:min(70px,calc(100% - 64px));height:auto;aspect-ratio:5/2;fill:rgba(255,255,255,.85)}
.slot .ic svg.s{flex:none;width:56px;height:56px;margin-left:8px;fill:rgba(255,255,255,.85)}
.board{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:auto 1fr 1fr;gap:6px;margin-bottom:8px}
.board>.cell[data-g]{min-height:230px}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.hd{background:var(--teal-bar);font-size:12px;font-weight:700;letter-spacing:.16em;text-align:center;padding:3px 0;margin-top:0;white-space:nowrap;overflow:hidden}
.col .hd:not(:first-child){margin-top:6px}
.cell{min-height:0;background:var(--panel);border:2px solid transparent;display:flex;flex-direction:column;justify-content:space-between;padding:4px 6px;cursor:pointer;position:relative;text-align:left;min-width:0}
.cell:hover{background:var(--panel-hi)}
.cell.on{border-color:var(--teal);background:rgba(111,227,196,.16)}
.cell.off{opacity:.38;cursor:default}
.cell.off:hover{background:var(--panel)}
.cell svg{flex:0 0 auto;width:100%;flex:1 1 0;min-height:0;margin:14px 0 6px;fill:rgba(255,255,255,.85);pointer-events:none}
.cell .sp{display:none}
.cell.sh{min-height:110px}
.cell.sh .nm{white-space:normal;line-height:1.05;font-size:14px}
.cell.sh svg{flex:0 0 auto;width:34px;height:34px;align-self:center;margin:8px 0 4px}
.px{font-size:15px;color:var(--muted);letter-spacing:.04em;position:relative}
.px .own{color:var(--teal);font-weight:700;letter-spacing:.1em}
.nm{font-size:16px;font-weight:600;letter-spacing:.06em;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{position:absolute;right:4px;top:3px;font-size:11px;color:var(--teal);font-weight:700;letter-spacing:.08em}
.abil{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.abil .cell{min-height:54px;flex:none}
.note{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-top:8px;text-align:center}
/* reveal */
.ov{position:fixed;inset:0;background:rgba(3,10,12,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.ov.show{display:flex}
.card{background:#10262a;border:1px solid var(--teal-dim);width:100%;max-width:460px;padding:16px}
.card h2{margin:0 0 10px;font-size:20px;letter-spacing:.14em;font-weight:700;color:var(--teal)}
.fr{display:grid;grid-template-columns:18px 96px 18px 96px 1fr 40px 44px;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line);font-size:16px;letter-spacing:.04em;height:48px}
.fr .vs{color:var(--muted);font-size:13px;text-align:center}
.card .hide{visibility:hidden}
.fr .ic{display:flex;align-items:center;height:36px;min-width:0}
.fr .ic svg.g{flex:none;width:66px;height:auto;aspect-ratio:5/2;fill:rgba(255,255,255,.85)}
.fr .ic svg.s{flex:none;width:24px;height:24px;margin-left:4px;fill:rgba(255,255,255,.85)}
.fr .ic{justify-content:flex-end}
.fr .foe .ic{justify-content:flex-start}
.fr .foe .ic svg{transform:scaleX(-1)}
.fr .pc{font-size:13px;color:var(--muted);text-align:right}
.fr .w{color:var(--teal);font-weight:700;text-align:right}
.fr .l{color:var(--red);font-weight:700;text-align:right}
.sum{margin-top:12px;font-size:18px;letter-spacing:.08em;min-height:44px}
.sum small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.card .lock{margin-top:12px}
.card .lock.wait{visibility:hidden}
@media (max-width:520px){.fr{grid-template-columns:16px 72px 16px 72px 1fr 34px 40px;gap:4px}.fr .ic svg.g{width:46px}.fr .ic svg.s{width:20px;height:20px}.slot{padding:8px 4px}.slot span{font-size:12px;letter-spacing:0}.foes .slot span{font-size:12px}.slot .ic svg.g{width:min(46px,calc(100% - 24px))}.slot .ic svg.s{width:20px;height:20px;margin-left:4px}.slot .ic{height:30px}.lbl .hd{font-size:8px;letter-spacing:0}.cr{font-size:24px}.nm,.px{font-size:11px}.hd{font-size:8px;letter-spacing:0}.cell{padding:3px 4px}.board>.cell[data-g]{min-height:190px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="cr" id="cr"></div>
    <div class="score" id="score"></div>
    <button class="lock" id="lock">LOCK IN</button>
  </div>
  <div class="lbl first"><div class="hd">ENEMY 1</div><div class="hd">ENEMY 2</div><div class="hd">ENEMY 3</div><div class="hd">ENEMY 4</div><div class="hd">ENEMY 5</div></div>
  <div class="slots foes" id="foes"></div>
  <div class="sb" id="sb"></div>
  <div class="board" id="board"></div>
  <div class="lbl" style="margin-top:8px" id="albl"></div>
  <div class="slots" id="slots"></div>
</div>
<div class="ov" id="ov"><div class="card" id="card"></div></div>
<script>
const SIL={
  classic:'M16 12h54v10H46l-2 5h-9l2-5H16z M20 22h14l-5 15H15z M17 10h5v2h-5z M64 10h4v2h-4z',
  ghost:'M6 10H36V13H58V22H44l-2 4H34l2-4H6z M9 22h13l-5 15H4z M58 14h38v4H58z M56 12h4v8h-4z',
  smg:'M87.4 9.0 L64.7 9.0 L64.7 12.2 L87.4 12.2z M66.1 8.0 L25.0 8.0 L25.0 15.5 L66.1 15.5z M23.6 11.4 L12.0 11.4 L12.0 21.7 L17.9 22.4 L21.2 16.9z M46.2 14.9 L38.4 14.9 L48.0 31.7 L53.0 32.8 L53.8 29.5z M38.4 15.5 L31.6 15.5 L28.3 25.8 L33.0 27.3 L35.7 22.4z',
  rifle:'M76.2 12.6 L95.9 13.2 L95.9 14.3 L76.2 14.5z M78.3 8.0 L81.0 8.0 L84.0 12.2 L78.3 12.2z M53.8 9.5 L74.2 9.5 L76.2 11.4 L76.2 16.5 L53.8 16.5z M32.0 9.5 L55.8 9.5 L55.8 17.0 L32.0 17.0z M4.0 11.4 L31.3 11.4 L31.3 16.5 L21.8 17.2 L17.1 20.6 L12.0 25.0 L4.0 25.0z M29.3 16.8 L36.1 16.8 L37.5 20.9 L33.0 29.4 L27.4 27.0 L28.6 22.3z M46.3 17.5 L53.1 17.5 L61.6 30.1 L57.2 35.2 L52.4 29.1z',
  phantom:'M72.0 12.5 L95.8 12.5 L95.8 16.4 L72.0 16.4z M33.1 10.2 L71.3 10.0 L72.0 12.5 L72.0 16.6 L33.1 16.6z M4.0 13.2 L27.1 13.2 L27.1 18.6 L19.7 19.2 L17.1 23.9 L4.0 23.9z M30.1 18.2 L35.8 18.2 L36.8 22.6 L30.1 29.3 L25.8 27.6 L27.8 23.3z M41.2 17.2 L48.6 17.2 L48.9 30.0 L41.9 30.3z',
  sniper:'M60.1 15.0 L82.9 15.0 L82.9 16.5 L60.1 16.5z M82.9 14.3 L95.8 14.3 L95.8 16.9 L82.9 16.9z M34.6 11.0 L58.9 11.0 L58.9 14.0 L34.6 14.0z M28.2 14.0 L62.0 14.0 L62.0 19.7 L28.2 19.7z M4.0 14.3 L20.9 14.3 L28.2 16.7 L28.2 21.6 L18.3 21.6 L10.7 26.2 L4.0 26.2z M22.1 21.6 L27.8 21.6 L25.9 27.0 L22.5 28.9 L20.9 27.9z M28.2 19.7 L62.0 19.7 L60.1 20.9 L41.8 22.9 L32.7 24.8 L28.2 23.2z'
};
// id, name, header, price, power, silhouette
const GUNS=[
  ['classic','CLASSIC','side',0,0,'classic'],['ghost','GHOST','side',500,1,'ghost'],['spectre','SPECTRE','smg',1600,3,'smg'],
  ['vandal','VANDAL','rifle',2900,5,'rifle'],['phantom','PHANTOM','rifle',2900,5,'phantom'],['operator','OPERATOR','sniper',4700,8,'sniper']
].map(([id,name,grp,price,pw,sil])=>({id,name,grp,price,pw,sil}));
const BY={};GUNS.forEach(g=>BY[g.id]=g);
const SH=[{name:'NO SHIELD',price:0,pw:0},{name:'LIGHT SHIELDS',price:400,pw:1},{name:'HEAVY SHIELDS',price:1000,pw:2}];
const POS={classic:[1,2],ghost:[1,3],spectre:[2,0],vandal:[3,2],phantom:[3,3],operator:[4,0]}; // [column, row], row 0 = both rows
// money is per agent, like the real game
const LOSS=[1900,2400,2900],WIN=3000,KILL=200,CAP=9000,START=800,OT=5000;
const wallets=n=>[Array(5).fill(n),Array(5).fill(n)];
const fmt=n=>n.toLocaleString('en-US');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const $=id=>document.getElementById(id);
const S={};

function newGame(){
  Object.assign(S,{played:0,me:0,foe:0,bank:wallets(START),kept:[Array(5).fill('classic'),Array(5).fill('classic')],ksh:[Array(5).fill(0),Array(5).fill(0)],streak:[0,0],picks:[],shp:[],hist:[],sel:0,step:'gun',pistol:false,ot:false,half:false,phase:'buy'});
  startRound();
}
function startRound(){
  const n=S.played+1;
  S.ot=S.me>=12&&S.foe>=12;
  S.half=n===13;
  S.pistol=n===1||n===13;
  if(S.pistol){S.bank=wallets(START);S.kept=[Array(5).fill('classic'),Array(5).fill('classic')];S.ksh=[Array(5).fill(0),Array(5).fill(0)];S.streak=[0,0]}
  if(S.ot){S.bank=wallets(OT);S.kept=[Array(5).fill('classic'),Array(5).fill('classic')];S.ksh=[Array(5).fill(0),Array(5).fill(0)]}
  S.picks=[...S.kept[0]];S.shp=[...S.ksh[0]];S.sel=0;S.step='gun';S.phase='buy';
  render();
}
const cost=(i,id)=>id===S.kept[0][i]?0:BY[id].price;
const shCost=(i,l)=>l===S.ksh[0][i]?0:SH[l].price;
const left=i=>S.bank[0][i]-cost(i,S.picks[i])-shCost(i,S.shp[i]);

// Buy order: gun, shield, gun, shield... A gun stays on its slot; a shield finishes the slot.
// A gun clicked while the slot waits for a shield skips the shield and goes to the next slot.
const gunSlot=()=>S.step==='shield'?(S.sel+1)%5:S.sel;
function pick(id){
  if(S.phase!=='buy')return;
  const i=gunSlot(),g=BY[id];
  if(S.pistol&&g.grp!=='side')return;
  // clicking the gun an agent already bought this round undoes it
  if(S.step==='gun'&&S.picks[i]===id&&id!==S.kept[0][i]){S.picks[i]=S.kept[0][i];render();return}
  if(cost(i,id)>left(i)+cost(i,S.picks[i]))return;
  S.picks[i]=id;S.sel=i;S.step='shield';render();
}

function pickShield(l){
  if(S.phase!=='buy')return;
  const i=S.sel;
  if(S.shp[i]===l&&l!==S.ksh[0][i]){S.shp[i]=S.ksh[0][i];render();return}
  if(shCost(i,l)>left(i)+shCost(i,S.shp[i]))return;
  S.shp[i]=l;S.sel=(i+1)%5;S.step='gun';render();
}

// gun picture plus shield picture (plain = light, cut-out = heavy), used by both slot rows
const SHD='M20 3l14 5v10c0 9-6 16-14 19C12 34 6 27 6 18V8z';
const icons=(id,l)=>`<div class="ic"><svg class="g" viewBox="0 0 100 40"><path d="${SIL[BY[id].sil]}"/></svg>${l?`<svg class="s" viewBox="0 0 40 40"><path d="${SHD}${l===2?' M20 10l7 2.5v6c0 5-3 9-7 11z':''}" fill-rule="evenodd"/></svg>`:''}</div>`;
function render(){
  const lossNext=LOSS[Math.min(S.streak[0]+1,3)-1];
  $('cr').innerHTML='¤ '+fmt(left(S.sel))+'<small>AGENT '+(S.sel+1)+' · NEXT LOSS +¤'+fmt(lossNext)+'</small>';
  const flag=S.ot?'OVERTIME':S.half?'HALFTIME · CREDITS RESET':S.pistol?'PISTOL ROUND':S.played===11?'LAST ROUND OF THE HALF':'';
  $('score').innerHTML='ROUND '+(S.played+1)+'<small>'+flag+'</small>';
  const X='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" class="m"><circle cx="6" cy="6" r="4.6"/><path d="M3.6 3.6l4.8 4.8M8.4 3.6l-4.8 4.8"/></svg>';
  const N=Math.max(24,S.hist.length+1);
  const track=side=>{let h='';for(let i=0;i<N;i++){
    if(i===12)h+='<i class="hf"></i>';
    const r=S.hist[i];
    h+=r===undefined?'<i class="d'+(i===S.hist.length?' cur':'')+'"></i>':(r===side?'<i>'+X+'</i>':'<i class="d"></i>');
  }return h};
  $('sb').innerHTML=`<div class="sbr foe"><b>ENEMY</b><span class="n">${S.foe}</span><div class="tr">${track(false)}</div></div><div class="sbr me"><b>YOU</b><span class="n">${S.me}</span><div class="tr">${track(true)}</div></div>`;
  $('albl').innerHTML=S.picks.map((_,i)=>`<div class="hd">AGENT ${i+1} · ¤${fmt(left(i))}</div>`).join('');
  $('slots').innerHTML=S.picks.map((id,i)=>`<button class="slot ${i===S.sel?'on':''}" data-s="${i}">${icons(id,S.shp[i])}<span>${BY[id].name}</span></button>`).join('');
  $('foes').innerHTML=S.kept[1].map((id,i)=>`<div class="slot">${icons(id,S.ksh[1][i])}<span>${BY[id].name}</span></div>`).join('');
  const gi=gunSlot(),avail=left(gi)+cost(gi,S.picks[gi]);
  const cell=(g)=>{
    const [col,row]=POS[g.id];
    const on=S.picks[S.sel]===g.id;
    const owned=g.id===S.kept[0][gi];
    const off=(S.pistol&&g.grp!=='side')||(!owned&&g.price>avail)||S.phase!=='buy';
    const tags=S.picks.map((p,i)=>p===g.id?i+1:'').filter(Boolean).join(' ');
    return `<button class="cell ${on?'on':''} ${off&&!on?'off':''}" data-g="${g.id}" style="grid-column:${col};${row?`grid-row:${row};min-height:110px`:'grid-row:2/4'}"><svg viewBox="0 0 100 40"><path d="${SIL[g.sil]}"/></svg>${tags?`<span class="tag">${tags}</span>`:''}<span class="sp"></span><span class="px">${owned?'<span class="own">OWNED</span>':'¤'+fmt(g.price)}</span><span class="nm">${g.name}</span></button>`;
  };
  let h=[['SIDEARMS',1],['SMGS',2],['RIFLES',3],['SNIPER RIFLES',4]].map(([t,c])=>`<div class="hd" style="grid-column:${c};grid-row:1">${t}</div>`).join('')+GUNS.map(cell).join('');
  const avs=left(S.sel)+shCost(S.sel,S.shp[S.sel]);
  h+='<div class="hd" style="grid-column:5;grid-row:1">ARMOR</div>'+[1,2].map(l=>{
    const on=S.shp[S.sel]===l,owned=S.ksh[0][S.sel]===l,off=(!owned&&SH[l].price>avs)||S.phase!=='buy';
    const tags=S.shp.map((p,i)=>p===l?i+1:'').filter(Boolean).join(' ');
    return `<button class="cell sh ${on?'on':''} ${off&&!on?'off':''}" data-sh="${l}" style="grid-column:5;grid-row:${l+1}"><svg viewBox="0 0 40 40"><path d="M20 3l14 5v10c0 9-6 16-14 19C12 34 6 27 6 18V8z${l===2?' M20 10l7 2.500v6c0 5-3 9-7 11z':''}" fill-rule="evenodd"/></svg>${tags?`<span class="tag">${tags}</span>`:''}<span class="sp"></span><span class="px">${owned?'<span class="own">OWNED</span>':'¤'+fmt(SH[l].price)}</span><span class="nm">${SH[l].name}</span></button>`;
  }).join('');
  $('board').innerHTML=h;
  $('lock').disabled=S.phase!=='buy';
}

// enemy buy: each agent spends its own wallet. A poor agent may save; otherwise it buys
// the best gun it can afford (sometimes leaving room for a shield), then a shield with what is left.
function botBuy(){
  const kept=S.kept[1],out=[...kept],sh=[...S.ksh[1]];
  const pool=GUNS.filter(g=>!S.pistol||g.grp==='side').sort((a,b)=>b.price-a.price||Math.random()-.5);
  for(let i=0;i<5;i++){
    let left=S.bank[1][i];
    if(!S.ot&&left<2400&&Math.random()<.5)continue;
    const keep=Math.random()<.6?400:0;
    const g=pool.find(g=>g.price<=left-keep)||pool.find(g=>g.price<=left);
    if(g&&g.price>BY[kept[i]].price){out[i]=g.id;left-=g.price}
    const l=left>=1000&&Math.random()<.5?2:left>=400&&Math.random()<.8?1:0;
    if(l>sh[i])sh[i]=l;
  }
  return {guns:out,sh};
}

function resolve(){
  S.phase='reveal';render();
  const me=[...S.picks],mesh=[...S.shp],fb=botBuy(),foe=fb.guns,fsh=fb.sh;
  const spend=[me.map((id,i)=>cost(i,id)+shCost(i,mesh[i])),foe.map((id,i)=>(id===S.kept[1][i]?0:BY[id].price)+(fsh[i]===S.ksh[1][i]?0:SH[fsh[i]].price))];
  const res=me.map((id,i)=>{
    const a=BY[id],b=BY[foe[i]];
    const chance=clamp(.5+.05*((a.pw+SH[mesh[i]].pw)-(b.pw+SH[fsh[i]].pw)),.05,.95);
    return {a:icons(id,mesh[i]),b:icons(foe[i],fsh[i]),chance,win:Math.random()<chance};
  });
  const wins=res.filter(r=>r.win).length,won=wins>=3;
  const gain=[0,0];
  [0,1].forEach(s=>{
    const w=s===0?won:!won;
    let inc;
    if(w){S.streak[s]=0;inc=WIN}else{S.streak[s]++;inc=LOSS[Math.min(S.streak[s],3)-1]}
    S.bank[s]=S.bank[s].map((b,i)=>{
      const kill=(s===0)===res[i].win?KILL:0;   // only the agent that won its fight
      gain[s]+=inc+kill;
      return Math.min(CAP,b-spend[s][i]+inc+kill);
    });
  });
  S.kept[0]=me.map((id,i)=>res[i].win?id:'classic');
  S.kept[1]=foe.map((id,i)=>res[i].win?'classic':id);
  S.ksh[0]=mesh.map((l,i)=>res[i].win?l:0);
  S.ksh[1]=fsh.map((l,i)=>res[i].win?0:l);
  S.played++;S.hist.push(won);if(won)S.me++;else S.foe++;
  const over=Math.max(S.me,S.foe)>=13&&Math.abs(S.me-S.foe)>=2;

  // The box opens at full size showing the round title, line numbers, your guns, "vs", the
  // ROUND / YOU EARNED labels and a dim button. Each beat then reveals one more thing:
  // each enemy side, its WIN/LOSS, the round score, the money, and the button lights up.
  const w=S.me>S.foe;
  $('ov').classList.add('show');
  $('card').innerHTML='<h2 id="ttl">ROUND '+S.played+'</h2><div id="rows">'
    +res.map((r,i)=>`<div class="fr"><b>${i+1}</b><span>${r.a}</span><span class="vs">vs</span><span class="foe hide" id="fb${i}">${r.b}</span><span></span><span class="pc hide" id="fp${i}">${Math.round(r.chance*100)}%</span><span class="${r.win?'w':'l'} hide" id="fw${i}">${r.win?'WIN':'LOSS'}</span></div>`).join('')
    +`</div><div class="sum">ROUND <span class="hide" id="sh">${won?'WON':'LOST'} · ${wins}–${5-wins}</span><small>YOU EARNED <span class="hide" id="ss">¤${fmt(gain[0])}</span></small></div><button class="lock" id="next" disabled>NEXT ROUND</button>`;
  const beats=[];
  res.forEach((r,i)=>beats.push(['fb'+i,'fp'+i],['fw'+i]));
  beats.push(['sh'],['ss']);
  const BEAT=1000;
  beats.forEach((ids,k)=>setTimeout(()=>ids.forEach(id=>$(id).classList.remove('hide')),BEAT*(k+1)));
  setTimeout(()=>{
    const b=$('next');
    if(over){$('ttl').textContent=(w?'VICTORY':'DEFEAT')+' · '+S.me+'–'+S.foe;b.textContent='PLAY AGAIN'}
    b.disabled=false;
    b.onclick=over?()=>{$('ov').classList.remove('show');newGame()}:()=>{$('ov').classList.remove('show');startRound()};
    b.focus();
  },BEAT*(beats.length+1));
}

$('board').addEventListener('click',e=>{const c=e.target.closest('[data-g]');if(c)pick(c.dataset.g);const d=e.target.closest('[data-sh]');if(d)pickShield(+d.dataset.sh)});
$('slots').addEventListener('click',e=>{const c=e.target.closest('[data-s]');if(c&&S.phase==='buy'){S.sel=+c.dataset.s;S.step='gun';render()}});
// right-click a slot: undo this round's buy in that slot
$('slots').addEventListener('contextmenu',e=>{const c=e.target.closest('[data-s]');if(!c)return;e.preventDefault();if(S.phase!=='buy')return;const i=+c.dataset.s;S.picks[i]=S.kept[0][i];S.shp[i]=S.ksh[0][i];S.sel=i;S.step='gun';render()});
$('lock').onclick=()=>{if(S.phase==='buy')resolve()};
document.addEventListener('keydown',e=>{
  if(S.phase==='buy'){
    if(e.key>='1'&&e.key<='5'){S.sel=+e.key-1;S.step='gun';render()}
    else if(e.key==='Enter')resolve();
  }else if(e.key==='Enter'){const n=$('next');if(n&&n.onclick)n.click()}
});
newGame();
</script>
</body>
</html>
